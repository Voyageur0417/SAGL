[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "sagl"
version = "1.0.0"
description = "Sparse Appearance-Guided Global Linking"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4", "scipy==1.15.3", "PyYAML==6.0.3"]
[tool.setuptools.packages.find]
where = ["src"]
